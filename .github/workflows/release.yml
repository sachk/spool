name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release input
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Validate tag and embedded versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || {
            printf 'expected v0.x.y, got %s\n' "$RELEASE_TAG" >&2
            exit 1
          }
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          tools/check-release-version.sh "${RELEASE_TAG#v}"
      - name: Package exact corresponding source
        run: tools/package-release-source.sh release-source
      - name: Upload corresponding source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: spool-for-jellyfin-corresponding-source
          path: release-source/*
          retention-days: 1

  platforms:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build-artifacts.yml
    with:
      release: true
      enable_macos_signing: ${{ vars.ENABLE_MACOS_SIGNING == 'true' }}
    secrets: inherit


  publish:
    name: Scan, attest, and publish prerelease
    needs: platforms
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Download final packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Install analysis prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes p7zip-full
          tools/install-release-scanners.sh "$RUNNER_TEMP/release-tools"
      - name: Generate and scan per-package SBOMs
        env:
          SYFT: ${{ runner.temp }}/release-tools/syft
          GRYPE: ${{ runner.temp }}/release-tools/grype
        run: |
          tools/analyze-release-artifacts.sh release-assets release-reports
          rm release-assets/*.dmg.app.tar.gz
          mv release-reports/* release-assets/
      - name: Generate final checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          checksum_file="$RUNNER_TEMP/SHA256SUMS.txt"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z | xargs -0 sha256sum >"$checksum_file"
          mv "$checksum_file" SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Attest final release files
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*
      - name: Write release safety notice
        env:
          MACOS_SIGNED: ${{ vars.ENABLE_MACOS_SIGNING == 'true' }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$TAG"
          gh api --method POST "repos/$REPO/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >generated-notes.md


          # The asset list is mostly SBOM and scan sidecars, which bury the
          # files people actually install. Build the table from what is really
          # on disk so a renamed or dropped package leaves no dead link. Every
          # sidecar ends in .json, so matching each package's own suffix keeps
          # them out without naming them.
          rows=()
          add_row() {
            local label="$1" pattern="$2" name
            name="$(find release-assets -maxdepth 1 -type f -name "$pattern" -printf '%f\n' \
              | sort | head -1)"
            [[ -n "$name" ]] || return 0
            rows+=("| $label | [\`$name\`]($base/$name) |")
          }
          add_row 'macOS — Apple Silicon' '*-macOS-arm64.dmg'
          add_row 'macOS — Intel' '*-macOS-x86_64.dmg'
          add_row 'Windows — installer' '*-Windows-x64-Setup.exe'
          add_row 'Windows — portable' '*-Windows-x64-Portable.exe'
          add_row 'Linux — AppImage' '*-x86_64.AppImage'
          add_row 'LG webOS TV' '*_arm.ipk'
          add_row 'Android phone — 64-bit ARM' 'spool-phone-arm64-v8a.apk'
          add_row 'Android phone — 32-bit ARM' 'spool-phone-armeabi-v7a.apk'
          add_row 'Android phone — x86-64' 'spool-phone-x86_64.apk'
          add_row 'Android TV — 64-bit ARM' 'spool-tv-arm64-v8a.apk'
          add_row 'Android TV — 32-bit ARM' 'spool-tv-armeabi-v7a.apk'
          add_row 'Android TV — x86-64' 'spool-tv-x86_64.apk'

          {
            cat generated-notes.md
            echo
            if (( ${#rows[@]} )); then
              echo '## Downloads'
              echo
              echo '| Platform | File |'
              echo '| --- | --- |'
              printf '%s\n' "${rows[@]}"
              echo
              echo "Checksums: [\`SHA256SUMS.txt\`]($base/SHA256SUMS.txt)."
              echo "The \`.spdx.json\`, \`.cdx.json\` and \`.grype.json\` assets are per-package SBOMs and vulnerability scans — nothing you need in order to install."
              echo
            fi
            echo '## Alpha installation trust'
            echo
            echo "This is prerelease software. Verify \`SHA256SUMS.txt\` and the GitHub artifact attestations before use."
            echo 'The Windows installer and portable executable are **not Authenticode signed**.'
            if [[ "$MACOS_SIGNED" != true ]]; then
              echo 'The macOS DMG is **not Developer ID signed or notarized**.'
            fi
          } >release-notes.md
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "${assets[@]}" \
            --verify-tag \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
      - name: Generate Android update metadata
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          phone_arm64='release-assets/spool-phone-arm64-v8a.apk'
          phone_armv7='release-assets/spool-phone-armeabi-v7a.apk'
          phone_x86_64='release-assets/spool-phone-x86_64.apk'
          tv_arm64='release-assets/spool-tv-arm64-v8a.apk'
          tv_armv7='release-assets/spool-tv-armeabi-v7a.apk'
          tv_x86_64='release-assets/spool-tv-x86_64.apk'
          for apk in "$phone_arm64" "$phone_armv7" "$phone_x86_64" "$tv_arm64" "$tv_armv7" "$tv_x86_64"; do
            test -f "$apk"
          done
          version="${TAG#v}"
          IFS=. read -r major minor patch <<<"$version"
          version_code=$((major * 100000000 + minor * 100000 + patch * 100 + 99))
          base="https://github.com/$REPO/releases/download/$TAG"
          mkdir -p update-pages/updates
          jq -n \
            --arg version "$version" \
            --argjson versionCode "$version_code" \
            --arg releaseUrl "https://github.com/$REPO/releases/tag/$TAG" \
            --rawfile notes generated-notes.md \
            --arg phoneArm64Url "$base/$(basename "$phone_arm64")" \
            --arg phoneArm64Sha "$(sha256sum "$phone_arm64" | cut -d' ' -f1)" \
            --argjson phoneArm64Size "$(stat -c%s "$phone_arm64")" \
            --arg phoneArmv7Url "$base/$(basename "$phone_armv7")" \
            --arg phoneArmv7Sha "$(sha256sum "$phone_armv7" | cut -d' ' -f1)" \
            --argjson phoneArmv7Size "$(stat -c%s "$phone_armv7")" \
            --arg phoneX8664Url "$base/$(basename "$phone_x86_64")" \
            --arg phoneX8664Sha "$(sha256sum "$phone_x86_64" | cut -d' ' -f1)" \
            --argjson phoneX8664Size "$(stat -c%s "$phone_x86_64")" \
            --arg tvArm64Url "$base/$(basename "$tv_arm64")" \
            --arg tvArm64Sha "$(sha256sum "$tv_arm64" | cut -d' ' -f1)" \
            --argjson tvArm64Size "$(stat -c%s "$tv_arm64")" \
            --arg tvArmv7Url "$base/$(basename "$tv_armv7")" \
            --arg tvArmv7Sha "$(sha256sum "$tv_armv7" | cut -d' ' -f1)" \
            --argjson tvArmv7Size "$(stat -c%s "$tv_armv7")" \
            --arg tvX8664Url "$base/$(basename "$tv_x86_64")" \
            --arg tvX8664Sha "$(sha256sum "$tv_x86_64" | cut -d' ' -f1)" \
            --argjson tvX8664Size "$(stat -c%s "$tv_x86_64")" \
            '{
              schemaVersion: 1,
              releases: [{
                channel: "release",
                version: $version,
                versionCode: $versionCode,
                releaseUrl: $releaseUrl,
                notes: $notes,
                assets: {
                  "phone-arm64-v8a": {url: $phoneArm64Url, sha256: $phoneArm64Sha, size: $phoneArm64Size},
                  "phone-armeabi-v7a": {url: $phoneArmv7Url, sha256: $phoneArmv7Sha, size: $phoneArmv7Size},
                  "phone-x86_64": {url: $phoneX8664Url, sha256: $phoneX8664Sha, size: $phoneX8664Size},
                  "tv-arm64-v8a": {url: $tvArm64Url, sha256: $tvArm64Sha, size: $tvArm64Size},
                  "tv-armeabi-v7a": {url: $tvArmv7Url, sha256: $tvArmv7Sha, size: $tvArmv7Size},
                  "tv-x86_64": {url: $tvX8664Url, sha256: $tvX8664Sha, size: $tvX8664Size}
                }
              }]
            }' >update-pages/updates/android.json
          jq -e '.schemaVersion == 1 and (.releases | length) == 1' update-pages/updates/android.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: spool-android-update-pages
          path: update-pages
          retention-days: 1

  deploy-update-metadata:
    name: Publish Android update metadata
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spool-android-update-pages
          path: update-pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: update-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release input
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Validate tag and embedded versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || {
            printf 'expected v0.x.y, got %s\n' "$RELEASE_TAG" >&2
            exit 1
          }
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          tools/check-release-version.sh "${RELEASE_TAG#v}"
      - name: Package exact corresponding source
        run: tools/package-release-source.sh release-source
      - name: Upload corresponding source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: jellyfin-native-corresponding-source
          path: release-source/*
          retention-days: 1

  platforms:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build-artifacts.yml
    with:
      release: true
      enable_macos_signing: ${{ vars.ENABLE_MACOS_SIGNING == 'true' }}
    secrets: inherit

  windows:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/windows-packages.yml
    with:
      release: true
      enable_windows_signing: ${{ vars.ENABLE_WINDOWS_SIGNING == 'true' }}
    secrets: inherit

  publish:
    name: Scan, attest, and publish prerelease
    needs: [platforms, windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Download final packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Install analysis prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes p7zip-full
          tools/install-release-scanners.sh "$RUNNER_TEMP/release-tools"
      - name: Generate and scan per-package SBOMs
        env:
          SYFT: ${{ runner.temp }}/release-tools/syft
          GRYPE: ${{ runner.temp }}/release-tools/grype
        run: |
          tools/analyze-release-artifacts.sh release-assets release-reports
          mv release-reports/* release-assets/
      - name: Generate final checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          checksum_file="$RUNNER_TEMP/SHA256SUMS.txt"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z | xargs -0 sha256sum >"$checksum_file"
          mv "$checksum_file" SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Attest final release files
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*
      - name: Write release safety notice
        env:
          MACOS_SIGNED: ${{ vars.ENABLE_MACOS_SIGNING == 'true' }}
          WINDOWS_SIGNED: ${{ vars.ENABLE_WINDOWS_SIGNING == 'true' }}
        run: |
          {
            echo '## Alpha installation trust'
            echo
            echo "This is prerelease software. Verify \`SHA256SUMS.txt\` and the GitHub artifact attestations before use."
            if [[ "$WINDOWS_SIGNED" != true ]]; then
              echo 'The Windows installer and portable executable are **not Authenticode signed**.'
            fi
            if [[ "$MACOS_SIGNED" != true ]]; then
              echo 'The macOS DMG is **not Developer ID signed or notarized**.'
            fi
          } >release-notes.md
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false

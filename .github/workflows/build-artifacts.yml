name: build artifacts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_linux:
        description: "Build Linux AppImage"
        required: true
        default: true
        type: boolean
      build_macos:
        description: "Build macOS DMG"
        required: true
        default: false
        type: boolean
      build_webos:
        description: "Build webOS IPK"
        required: true
        default: false
        type: boolean
      webos_toolchain_archive_url:
        description: "Optional tar archive containing build/webos-sdk and Qt webOS prefixes"
        required: false
        type: string

jobs:
  lint:
    name: Lint scripts
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' | sort -u)
          printf 'checking %d scripts\n' "${#scripts[@]}"
          for s in "${scripts[@]}"; do
            bash -n "$s"
          done

      - name: Verify shared build library sources and exports its helpers
        run: |
          source tools/lib/build-common.sh
          for fn in mpv_meson_build cmake_build_app resolve_qmlimportscanner; do
            declare -F "$fn" >/dev/null || { echo "missing helper: $fn" >&2; exit 1; }
          done
          echo "build-common.sh OK"

  linux-appimage:
    name: Linux AppImage
    runs-on: [self-hosted, linux, X64]
    needs: lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G

      - uses: actions/cache@v4
        with:
          path: |
            .ccache
            build/linux-release
            build/appimage
          key: linux2-${{ runner.os }}-${{ hashFiles('mpv/meson.build', 'tools/build-linux-release.sh', 'tools/lib/build-common.sh', 'CMakeLists.txt') }}
          restore-keys: |
            linux2-${{ runner.os }}-

      # The default dev shell has no Qt on purpose (it is the hermetic Qt-source
      # build shell). The native app build needs nixpkgs Qt, so use .#native.
      - name: Build host app
        run: nix develop .#native -c bash tools/build-linux-release.sh

      - name: Package AppImage
        run: nix develop .#native -c bash tools/package-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-native-linux-appimage
          path: dist/*.AppImage

  macos-dmg:
    name: macOS DMG
    runs-on: macos-14
    needs: lint
    # macOS runners cost ~10x Linux minutes, so the DMG is built only on manual
    # dispatch. Every push/PR still gets the lint gate (which checks these
    # scripts) plus the Linux build for shared CMake/mpv coverage.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-macos: 8G

      - uses: actions/cache@v4
        with:
          path: |
            build/macos
            ~/Library/Caches/ccache
          key: macos-${{ runner.os }}-${{ hashFiles('mpv/meson.build', 'tools/build-macos.sh', 'tools/lib/build-common.sh', 'CMakeLists.txt') }}
          restore-keys: |
            macos-${{ runner.os }}-

      - name: Build macOS app
        run: nix develop .#native -c bash tools/build-macos.sh

      - name: Package DMG
        run: nix develop .#native -c bash tools/package-macos-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-native-macos-dmg
          path: dist/*.dmg

  webos-ipk:
    name: webOS IPK
    runs-on: [self-hosted, linux, X64]
    needs: lint
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_webos && (vars.WEBOS_TOOLCHAIN_ARCHIVE_URL != '' || inputs.webos_toolchain_archive_url != '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          gc-max-store-size-macos: 8G

      - uses: actions/cache@v4
        with:
          path: |
            build/webos-sdk
            build/qt6-611-host-install
            build/qt6-611-target-static-install
            build/qt6-611-target-install
            build/webos-thirdparty-build
            build/third_party
            .ccache
            mpv/build/webos-libmpv
          key: webos-${{ runner.os }}-${{ hashFiles('mpv/meson.build', 'build-ipk.sh', 'tools/webos-native/**') }}
          restore-keys: |
            webos-${{ runner.os }}-

      - name: Restore webOS toolchain archive
        env:
          INPUT_URL: ${{ github.event.inputs.webos_toolchain_archive_url }}
          VAR_URL: ${{ vars.WEBOS_TOOLCHAIN_ARCHIVE_URL }}
        run: |
          url="${INPUT_URL:-$VAR_URL}"
          if [ -n "$url" ] && [ ! -x build/webos-sdk/arm-webos-linux-gnueabi_sdk-buildroot/bin/arm-webos-linux-gnueabi-gcc ]; then
            curl -L --fail "$url" | tar xz
          fi
          test -x build/webos-sdk/arm-webos-linux-gnueabi_sdk-buildroot/bin/arm-webos-linux-gnueabi-gcc
          test -d build/qt6-611-host-install
          test -d build/qt6-611-target-static-install -o -d build/qt6-611-target-install

      # The cached Qt or the URL-restored toolchain archive may pre-date a
      # qtbase / qtwayland patch under tools/webos-native/patches. Probe
      # the static Qt for every patch marker; if any is missing rerun the
      # Qt build script so the new patches get applied. build-qt6-611.sh
      # is idempotent — extract/apply/configure skip when sources are
      # already up to date and ninja rebuilds only the changed objects.
      - name: Verify or rebuild patched Qt
        run: |
          set -e
          MARKERS=(JELLYFIN_QT_NO_CURSOR_SURFACE)
          missing=0
          for marker in "${MARKERS[@]}"; do
            if ! grep -rqal "$marker" build/qt6-611-target-static-install/lib build/qt6-611-target-install/lib 2>/dev/null; then
              echo "patched Qt missing marker: $marker"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Rebuilding Qt to pick up local patches"
            nix develop -c bash tools/webos-native/build-qt6-611.sh
          else
            echo "All Qt patches verified present"
          fi

      # build-ipk.sh uses the default dev shell on purpose: the webOS target
      # links the cross-built static Qt, and that build must not see nixpkgs Qt.
      - name: Build IPK
        run: nix develop -c bash build-ipk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-native-webos-ipk
          path: build/*.ipk

name: build artifacts

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      build_linux:
        description: "Build Linux AppImage"
        required: true
        default: true
        type: boolean
      build_macos:
        description: "Build macOS DMG"
        required: true
        default: false
        type: boolean
      build_windows:
        description: "Build Windows portable and installer packages"
        required: true
        default: true
        type: boolean
      build_webos:
        description: "Build webOS IPK"
        required: true
        default: false
        type: boolean
      webos_toolchain_archive_url:
        description: "Optional tar archive containing build/webos-sdk and Qt webOS prefixes"
        required: false
        type: string
  workflow_call:
    inputs:
      release:
        required: false
        default: false
        type: boolean
      enable_macos_signing:
        required: false
        default: false
        type: boolean
      enable_windows_signing:
        required: false
        default: false
        type: boolean
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      APPLE_NOTARY_KEY_P8:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      SIGNPATH_API_TOKEN:
        required: false

permissions:
  contents: read
concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 2
          submodules: recursive
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.1
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Check commit whitespace
        run: git show --check --format= HEAD

      - name: Syntax-check shell scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' | sort -u)
          printf 'checking %d scripts\n' "${#scripts[@]}"
          for s in "${scripts[@]}"; do
            bash -n "$s"
          done

      - name: Syntax-check Python scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.py' | sort -u)
          printf 'checking %d scripts\n' "${#scripts[@]}"
          nix develop -c python3 -m py_compile "${scripts[@]}"

      - name: Validate FFmpeg capability manifest
        run: |
          nix develop .#native -c python3 tests/tools/FfmpegCapabilitiesTest.py \
            tools/ffmpeg-capabilities.py tools/manifests/ffmpeg-capabilities.json

      - name: Evaluate Nix flake
        run: nix flake check --no-build --no-write-lock-file

      - name: Scan QML imports
        run: nix develop .#native -c bash tools/check-qml-imports.sh

      - name: Verify shared build library sources and exports its helpers
        run: |
          source tools/lib/build-common.sh
          for fn in mpv_meson_build cmake_build_app resolve_qmlimportscanner stage_elf_shared_library; do
            declare -F "$fn" >/dev/null || { echo "missing helper: $fn" >&2; exit 1; }
          done
          echo "build-common.sh OK"

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    needs: lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.1
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: .ccache
          key: linux4-${{ runner.os }}-${{ hashFiles('flake.lock', 'mpv/meson.build', 'mpv/meson.options', 'tools/manifests/mpv-native.json', 'tools/manifests/ffmpeg-capabilities.json', 'tools/ffmpeg-capabilities.py', 'tools/build-linux-release.sh', 'tools/lib/build-common.sh', 'CMakeLists.txt') }}
          restore-keys: |
            linux4-${{ runner.os }}-

      # The default dev shell has no Qt on purpose (it is the hermetic Qt-source
      # build shell). The native app build needs nixpkgs Qt, so use .#native.
      - name: Build host app
        run: nix develop .#native -c bash tools/build-linux-release.sh

      - name: Run native tests
        run: nix develop .#native -c ctest --test-dir build/linux-release/app -E '^mpv-video-item$' --output-on-failure

      - name: Run libmpv renderer test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_XCB_GL_INTEGRATION: xcb_glx
        run: nix shell nixpkgs#xvfb-run -c xvfb-run -a nix develop .#native -c ctest --test-dir build/linux-release/app -R '^mpv-video-item$' --output-on-failure

      - name: Lint compiled QML
        run: nix develop .#native -c cmake --build build/linux-release/app --target jellyfin-native_qmllint_strict

      - name: Smoke-test host app startup
        run: nix develop .#native -c bash tools/smoke-native-app.sh build/linux-release/install/bin/jellyfin-native

      - name: Package AppImage
        run: nix develop .#native -c bash tools/package-appimage.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: ${{ inputs.release }}
        with:
          name: spool-for-jellyfin-linux-appimage
          path: dist/*.AppImage
          retention-days: 1

  macos-dmg:
    name: macOS DMG
    runs-on: macos-14
    needs: lint
    # Public repositories receive unlimited standard GitHub-hosted runner
    # minutes, so pushes, pull requests, and releases exercise macOS too.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.1
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-macos: 8G

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: |
            build/macos
            ~/Library/Caches/ccache
          key: macos-${{ runner.os }}-${{ hashFiles('mpv/meson.build', 'tools/manifests/mpv-native.json', 'tools/manifests/ffmpeg-capabilities.json', 'tools/ffmpeg-capabilities.py', 'tools/build-macos.sh', 'tools/lib/build-common.sh', 'CMakeLists.txt') }}
          restore-keys: |
            macos-${{ runner.os }}-

      # Older Nix releases reject the relative path input recorded by newer
      # lock files when the root flake comes from a shallow Git checkout.
      # Override only the evaluator input with the exact checked-out submodule
      # revision; explicitly retain its shallow status rather than asking Nix
      # to treat the CI checkout as a complete repository. The build scripts
      # still compile the local mpv/ checkout.
      - name: Resolve checked-out mpv input
        run: |
          revision="$(git -C mpv rev-parse HEAD)"
          mv flake.lock flake.lock.repository
          nix flake lock --override-input mpv-src "git+file:$PWD/mpv?rev=$revision&shallow=1"

      - name: Build macOS app
        run: nix develop .#native --no-write-lock-file -c bash tools/build-macos.sh

      - name: Run native tests
        run: nix develop .#native --no-write-lock-file -c ctest --test-dir build/macos/app --output-on-failure

      - name: Lint compiled QML
        run: nix develop .#native --no-write-lock-file -c cmake --build build/macos/app --target jellyfin-native_qmllint_strict

      - name: Smoke-test macOS app startup
        run: nix develop .#native --no-write-lock-file -c bash tools/smoke-native-app.sh build/macos/install/jellyfin-native.app

      - name: Sign macOS application
        if: ${{ inputs.enable_macos_signing }}
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: tools/sign-macos.sh build/macos/install/jellyfin-native.app

      - name: Package DMG
        run: nix develop .#native --no-write-lock-file -c bash tools/package-macos-dmg.sh
      - name: Notarize and staple DMG
        if: ${{ inputs.enable_macos_signing }}
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: tools/notarize-macos.sh dist/*.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: ${{ inputs.release }}
        with:
          name: spool-for-jellyfin-macos-dmg
          path: dist/*.dmg
          retention-days: 1

  webos-ipk:
    name: webOS IPK
    runs-on: ubuntu-24.04
    needs: lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_webos }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.1
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        id: webos-cache
        with:
          path: |
            build/webos-sdk
            build/qt6-611-host-install
            build/qt6-611-target-static-install
            build/qt6-611-target-install
            build/webos-thirdparty-build
            build/webos-qcoro
            build/third_party
            .ccache
            mpv/build/webos-libmpv
          key: webos2-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'mpv/meson.build', 'build-ipk.sh', 'tools/lib/*.sh', 'tools/manifests/ffmpeg-capabilities.json', 'tools/manifests/mpv-native.json', 'tools/manifests/qt-webos-6.11.json', 'tools/manifests/webos-third-party.json', 'tools/webos-native/**') }}
          restore-keys: |
            webos2-${{ runner.os }}-
            webos-${{ runner.os }}-

      - name: Restore webOS toolchain archive
        env:
          INPUT_URL: ${{ inputs.webos_toolchain_archive_url || '' }}
          VAR_URL: ${{ vars.WEBOS_TOOLCHAIN_ARCHIVE_URL }}
        run: |
          if [ -n "${INPUT_URL:-$VAR_URL}" ]; then
            export WEBOS_TOOLCHAIN_ARCHIVE_URL="${INPUT_URL:-$VAR_URL}"
          fi
          nix develop -c bash tools/webos-native/restore-toolchain.sh
          test -x build/webos-sdk/arm-webos-linux-gnueabi_sdk-buildroot/bin/arm-webos-linux-gnueabi-gcc

      # build-webos.sh uses the default dev shell on purpose: the webOS target
      # links the cross-built static Qt, and that build must not see nixpkgs Qt.
      - name: Build webOS dependencies
        if: ${{ steps.webos-cache.outputs.cache-hit != 'true' }}
        run: |
          for phase in fetch qt-host qt-target dependencies; do
            nix develop -c bash tools/webos-native/build-webos.sh "$phase"
          done

      - name: Save webOS dependency cache
        if: ${{ steps.webos-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: |
            build/webos-sdk
            build/qt6-611-host-install
            build/qt6-611-target-static-install
            build/qt6-611-target-install
            build/webos-thirdparty-build
            build/webos-qcoro
            build/third_party
            .ccache
            mpv/build/webos-libmpv
          key: ${{ steps.webos-cache.outputs.cache-primary-key }}

      - name: Build IPK
        run: |
          for phase in app stage package; do
            nix develop -c bash tools/webos-native/build-webos.sh "$phase"
          done

      - name: Validate IPK
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipks=(build/*.ipk)
          if [ "${#ipks[@]}" -ne 1 ]; then
            printf 'expected exactly one IPK, found %d\n' "${#ipks[@]}" >&2
            exit 1
          fi
          ipk="${ipks[0]}"
          test -s "$ipk"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          ar t "$ipk" | tee "$work/members.txt"
          grep -qx debian-binary "$work/members.txt"
          grep -Eq '^control\.tar\.' "$work/members.txt"
          grep -Eq '^data\.tar\.' "$work/members.txt"

          repo="$PWD"
          (cd "$work" && ar x "$repo/$ipk")
          data_tar="$(find "$work" -maxdepth 1 -name 'data.tar.*' -print -quit)"
          test -n "$data_tar"
          tar -tf "$data_tar" | tee "$work/data-files.txt" >/dev/null
          grep -Eq '(^|/)appinfo\.json$' "$work/data-files.txt"
          grep -Eq '(^|/)bin/jellyfin-native$' "$work/data-files.txt"

          mkdir "$work/data"
          tar -xf "$data_tar" -C "$work/data"
          appinfo="$(find "$work/data" -name appinfo.json -print -quit)"
          test -n "$appinfo"
          python3 - "$appinfo" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              appinfo = json.load(handle)

          assert appinfo["id"] == "com.sachk.spool", appinfo.get("id")
          assert appinfo["main"] == "bin/jellyfin-native", appinfo.get("main")
          assert re.fullmatch(r"\d+\.\d+\.\d+", appinfo["version"]), appinfo.get("version")
          print(f"Validated {appinfo['id']} {appinfo['version']} IPK")
          PY

          launcher="$(find "$work/data" -path '*/bin/jellyfin-native' -type f -print -quit)"
          test -n "$launcher"
          test -x "$launcher"
          python3 - "$launcher" <<'PY'
          import os
          from pathlib import Path
          import struct
          import sys

          binary = Path(sys.argv[1])
          with binary.open("rb") as handle:
              header = handle.read(20)

          if header[:4] != b"\x7fELF":
              binary = binary.with_name("jellyfin-native.real")
              assert binary.is_file(), "launcher is not ELF and jellyfin-native.real is missing"
              assert os.access(binary, os.X_OK), "jellyfin-native.real is not executable"
              with binary.open("rb") as handle:
                  header = handle.read(20)

          assert header[:4] == b"\x7fELF", "app binary is not ELF"
          assert header[4] == 1, "app binary is not 32-bit ELF"
          assert header[5] == 1, "app binary is not little-endian ELF"
          elf_type, machine = struct.unpack_from("<HH", header, 16)
          assert elf_type in (2, 3), f"unexpected ELF type: {elf_type}"
          assert machine == 40, f"app binary is not ARM ELF: machine={machine}"
          print(f"Validated 32-bit little-endian ARM app binary: {binary.name}")
          PY

      - name: Package LGPL relink material
        if: ${{ inputs.release }}
        run: tools/package-webos-relink.sh build/relink

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: ${{ inputs.release }}
        with:
          name: spool-for-jellyfin-webos-ipk
          path: |
            build/*.ipk
            build/relink/*
          retention-days: 1

  windows-x64:
    name: Windows x64 portable and installer
    runs-on: windows-2025
    timeout-minutes: 75
    needs: lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    env:
      QT_VERSION: 6.11.1
      QT_ARCH: win64_msvc2022_64
      JELLYFIN_QT_ROOT: C:\Qt\6.11.1\msvc2022_64
      JELLYFIN_QCORO_ROOT: C:\Qt\qcoro-0.13-msvc2022
      QCORO_REVISION: d1b52b5db2ff9560185c39a4ed9f944dc610c235

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          submodules: recursive

      - name: Install build and packaging tools
        shell: pwsh
        run: |
          choco install meson --version=1.9.1 -y --no-progress
          choco install nasm nsis -y --no-progress
          $env:PATH = "C:\Program Files\LLVM\bin;C:\Program Files\Meson;C:\Program Files\NASM;${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          foreach ($tool in @('cmake', 'ninja', 'clang', 'lld-link', 'meson', 'nasm', 'makensis')) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $command) { throw "Required build tool is missing: $tool" }
            Write-Host "$tool -> $($command.Source)"
          }

      - name: Restore Qt and QCoro
        id: qt-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: |
            C:\Qt\6.11.1\msvc2022_64
            C:\Qt\qcoro-0.13-msvc2022
          key: windows-qt-6.11.1-qcoro-d1b52b5db2ff9560185c39a4ed9f944dc610c235-v1

      - name: Install Qt from pinned official archives
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: tools\windows\install-qt.ps1 -Force

      - name: Build QCoro
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . tools\windows\common.ps1
          Import-MsvcEnvironment
          $source = Join-Path $env:RUNNER_TEMP 'qcoro'
          $build = Join-Path $env:RUNNER_TEMP 'qcoro-build'
          git clone --filter=blob:none --no-checkout https://github.com/danvratil/qcoro.git $source
          git -C $source fetch --depth 1 origin $env:QCORO_REVISION
          git -C $source checkout --detach FETCH_HEAD
          cmake -S $source -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:JELLYFIN_QT_ROOT" `
            "-DCMAKE_INSTALL_PREFIX=$env:JELLYFIN_QCORO_ROOT" `
            -DQCORO_BUILD_EXAMPLES=OFF `
            -DQCORO_BUILD_TESTING=OFF `
            -DQCORO_WITH_QTDBUS=OFF `
            -DQCORO_WITH_QML=OFF `
            -DQCORO_WITH_QTQUICK=OFF `
            -DQCORO_WITH_QTTEST=OFF `
            -DQCORO_WITH_QTWEBSOCKETS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'QCoro configuration failed.' }
          cmake --build $build
          if ($LASTEXITCODE -ne 0) { throw 'QCoro build failed.' }
          cmake --install $build
          if ($LASTEXITCODE -ne 0) { throw 'QCoro installation failed.' }

      - name: Save Qt and QCoro
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: |
            C:\Qt\6.11.1\msvc2022_64
            C:\Qt\qcoro-0.13-msvc2022
          key: windows-qt-6.11.1-qcoro-d1b52b5db2ff9560185c39a4ed9f944dc610c235-v1

      - name: Read mpv revision
        id: mpv-revision
        shell: pwsh
        run: |
          "revision=$(git -C mpv rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Restore source-built libmpv
        id: mpv-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: build/windows-deps/mpv
          key: windows-mpv-${{ runner.os }}-${{ steps.mpv-revision.outputs.revision }}-${{ hashFiles('tools/windows/build-mpv.ps1', 'tools/windows/common.ps1', 'tools/manifests/mpv-native.json', 'tools/manifests/ffmpeg-capabilities.json', 'tools/ffmpeg-capabilities.py') }}

      - name: Build libmpv from the fork
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        shell: pwsh
        run: tools\windows\build-mpv.ps1 -Clean

      - name: Save source-built libmpv
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: build/windows-deps/mpv
          key: windows-mpv-${{ runner.os }}-${{ steps.mpv-revision.outputs.revision }}-${{ hashFiles('tools/windows/build-mpv.ps1', 'tools/windows/common.ps1', 'tools/manifests/mpv-native.json', 'tools/manifests/ffmpeg-capabilities.json', 'tools/ffmpeg-capabilities.py') }}

      - name: Build application
        shell: pwsh
        run: tools\windows\build.ps1 -Clean

      - name: Run tests
        shell: pwsh
        run: tools\windows\test.ps1

      - name: Stage release payload
        shell: pwsh
        run: tools\windows\stage.ps1

      - name: Smoke-test staged Windows application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          & build\windows-release\stage\jellyfin-native.exe --smoke-and-exit
          if ($LASTEXITCODE -ne 0) { throw 'Staged Windows application smoke test failed.' }

      - name: Build portable and installer packages
        shell: pwsh
        run: tools\windows\package.ps1

      - name: Upload portable executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: ${{ inputs.release }}
        with:
          name: spool-for-jellyfin-windows-x64-portable
          path: |
            dist/*-Portable.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload installer executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: ${{ inputs.release }}
        with:
          name: spool-for-jellyfin-windows-x64-installer
          path: |
            dist/*-Setup.exe
